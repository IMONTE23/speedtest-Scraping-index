<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Speedtest Global Index Scraper</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <div class="brand">
        <div class="brand-icon">⚡</div>
        <div class="brand-title">
          <h1>Speedtest Scraper</h1>
          <p>Country &amp; City Rankings</p>
        </div>
      </div>
      <div class="header-right">
        <button id="btnOpenPage" class="btn-link" title="Open https://www.speedtest.net/global-index">
          🌐 Open Link
        </button>
        <div id="statusBadge" class="status-badge idle">
          <span class="status-dot"></span>
          <span id="statusText">Idle</span>
        </div>
      </div>
    </header>

    <div class="actions-bar">
      <button id="btnScrape" class="btn btn-primary">
        <span>⚡</span> Scrape Page
      </button>
      <button id="btnExportExcel" class="btn btn-success" disabled>
        <span>📊</span> Excel
      </button>
    </div>

    <footer class="app-footer">
      <span id="summaryText" class="summary-text">Click "Scrape Page" on speedtest.net/global-index</span>
      <span id="versionText" class="version-text">v2026-11-27 09:23</span>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
